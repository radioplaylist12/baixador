<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Local</title>
    <style>
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #15151c;
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #ff0000;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid #333;
            background: #1e1e24;
            color: white;
        }
        button {
            background: #ff0000;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .format-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 12px;
            background: #1e1e24;
            text-align: center;
        }
        .success {
            color: #0f0;
        }
        .error {
            color: #f00;
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            background: #0f0;
            color: #000;
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📥 YouTube Downloader</h1>
    <div class="format-group">
        <label><input type="radio" name="format" value="mp4" checked> 🎥 Vídeo (MP4)</label>
        <label><input type="radio" name="format" value="mp3"> 🎵 Áudio (MP3)</label>
    </div>
    <div class="input-group">
        <input type="text" id="url" placeholder="Cole a URL do YouTube">
        <button id="downloadBtn">Baixar</button>
    </div>
    <div id="status" class="status">Aguardando...</div>
</div>

<script>
    document.getElementById('downloadBtn').addEventListener('click', async () => {
        const url = document.getElementById('url').value.trim();
        if (!url) {
            alert('Digite uma URL');
            return;
        }
        const format = document.querySelector('input[name="format"]:checked').value;
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '⏳ Processando, aguarde...';
        statusDiv.className = 'status';
        
        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, format })
            });
            const data = await response.json();
            if (data.success) {
                statusDiv.innerHTML = `✅ Download concluído! <a href="${data.downloadPath}" class="download-link" download>Clique para salvar</a>`;
                statusDiv.classList.add('success');
            } else {
                statusDiv.innerHTML = `❌ Erro: ${data.error}`;
                statusDiv.classList.add('error');
            }
        } catch (err) {
            statusDiv.innerHTML = `❌ Erro de conexão: ${err.message}`;
            statusDiv.classList.add('error');
        }
    });
</script>
</body>
</html>
