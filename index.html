<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>YouTube Downloader - Baixe Vídeos e Músicas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #15151c;
      --primary: #ff0000;
      --primary-dark: #cc0000;
      --text: #f1f1f1;
      --text-muted: #aaa;
      --border: #2a2a2a;
      --success: #0f0;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    .sub {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 2rem;
      border-left: 3px solid var(--primary);
      padding-left: 1rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 60px;
      border: 1px solid var(--border);
      background: #1e1e24;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(255,0,0,0.3);
    }

    button {
      background: var(--primary);
      border: none;
      padding: 0 28px;
      border-radius: 60px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: 0.1s;
      font-size: 1rem;
    }

    button:active {
      transform: scale(0.97);
    }

    .format-group {
      margin: 1.5rem 0;
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .format-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .loading {
      display: none;
      text-align: center;
      margin: 1rem 0;
      color: var(--primary);
    }

    .results {
      margin-top: 2rem;
      display: none;
    }

    .title-details {
      background: #1a1a22;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 1rem;
    }

    .thumbnail {
      width: 100%;
      max-width: 200px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .quality-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 1rem;
    }

    .quality-btn {
      background: #2a2a35;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid var(--border);
    }

    .quality-btn:hover {
      background: var(--primary);
      color: white;
    }

    .download-link {
      display: inline-block;
      background: var(--success);
      color: black;
      padding: 10px 20px;
      border-radius: 40px;
      margin-top: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      .input-group { flex-direction: column; }
      button { padding: 12px; width: 100%; }
      .format-group { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎬 YouTube Downloader</h1>
  <div class="sub">Baixe vídeos em MP4 ou extraia áudio em MP3</div>

  <div class="card">
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="Cole o link do YouTube aqui... (ex: https://youtu.be/... ou https://www.youtube.com/watch?v=...)" autocomplete="off">
      <button id="fetchBtn">🔍 Analisar</button>
    </div>

    <div class="format-group">
      <label><input type="radio" name="format" value="mp4" checked> 🎥 Vídeo (MP4)</label>
      <label><input type="radio" name="format" value="mp3"> 🎵 Áudio (MP3)</label>
    </div>

    <div class="loading" id="loading">
      <i class="fas fa-circle-notch fa-spin"></i> Processando... aguarde
    </div>

    <div class="results" id="results">
      <div class="title-details" id="videoDetails"></div>
      <div id="qualities"></div>
      <div id="downloadArea"></div>
    </div>
  </div>

  <footer>
    ⚡ Funciona via servidor proxy para contornar restrições do YouTube. <br>
    Apenas para uso pessoal – respeite os direitos autorais.
  </footer>
</div>

<script>
  // ============================================================
  // SERVIDOR PROXY PÚBLICO (substitua por seu próprio backend se desejar)
  // ATENÇÃO: Este proxy é apenas para demonstração. Para uso real,
  // recomenda-se hospedar seu próprio backend com ytdl-core.
  // ============================================================
  const PROXY_API = 'https://ytdl-server-9g0c.onrender.com/api/info'; // Exemplo de endpoint público (pode parar de funcionar)

  // Caso o proxy público esteja offline, você pode usar uma API local ou outro serviço.
  // Aqui usaremos uma abordagem híbrida: primeiro tenta o proxy, depois mostra instruções.

  document.getElementById('fetchBtn').addEventListener('click', fetchVideo);
  document.getElementById('videoUrl').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') fetchVideo();
  });

  async function fetchVideo() {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) {
      alert('Por favor, cole uma URL válida do YouTube.');
      return;
    }

    const format = document.querySelector('input[name="format"]:checked').value;
    const loadingDiv = document.getElementById('loading');
    const resultsDiv = document.getElementById('results');
    const qualitiesDiv = document.getElementById('qualities');
    const downloadArea = document.getElementById('downloadArea');
    const videoDetails = document.getElementById('videoDetails');

    // Reset UI
    resultsDiv.style.display = 'none';
    qualitiesDiv.innerHTML = '';
    downloadArea.innerHTML = '';
    videoDetails.innerHTML = '';
    loadingDiv.style.display = 'block';

    try {
      // 1. Enviar requisição para o servidor proxy
      const response = await fetch(PROXY_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url, format: format })
      });

      if (!response.ok) throw new Error('Falha na comunicação com o servidor');

      const data = await response.json();
      console.log(data);

      // Exibir detalhes do vídeo
      videoDetails.innerHTML = `
        <strong>🎬 Título:</strong> ${data.title}<br>
        <strong>⏱️ Duração:</strong> ${data.duration}<br>
        <strong>👤 Canal:</strong> ${data.author}<br>
        <img src="${data.thumbnail}" class="thumbnail" alt="thumbnail">
      `;

      if (format === 'mp4') {
        // Exibir opções de qualidade (vídeo)
        const formats = data.formats.filter(f => f.hasVideo && f.hasAudio);
        if (formats.length === 0) {
          qualitiesDiv.innerHTML = '<p>Nenhum formato de vídeo disponível.</p>';
        } else {
          qualitiesDiv.innerHTML = '<strong>📥 Escolha a qualidade:</strong><div class="quality-list"></div>';
          const list = qualitiesDiv.querySelector('.quality-list');
          formats.forEach(f => {
            const btn = document.createElement('div');
            btn.className = 'quality-btn';
            btn.textContent = `${f.qualityLabel} (${f.container})`;
            btn.addEventListener('click', () => {
              downloadArea.innerHTML = `<a href="${f.url}" class="download-link" download>Baixar ${f.qualityLabel} MP4</a>`;
            });
            list.appendChild(btn);
          });
        }
      } else {
        // Modo MP3 – mostrar opções de áudio
        const audioFormats = data.formats.filter(f => f.hasAudio && !f.hasVideo);
        if (audioFormats.length === 0) {
          qualitiesDiv.innerHTML = '<p>Nenhum formato de áudio disponível.</p>';
        } else {
          qualitiesDiv.innerHTML = '<strong>🎧 Escolha a qualidade do áudio:</strong><div class="quality-list"></div>';
          const list = qualitiesDiv.querySelector('.quality-list');
          audioFormats.forEach(f => {
            const btn = document.createElement('div');
            btn.className = 'quality-btn';
            btn.textContent = `${f.audioBitrate || '128kbps'} (${f.container})`;
            btn.addEventListener('click', () => {
              downloadArea.innerHTML = `<a href="${f.url}" class="download-link" download>Baixar MP3</a>`;
            });
            list.appendChild(btn);
          });
        }
      }

      resultsDiv.style.display = 'block';
    } catch (error) {
      console.error(error);
      videoDetails.innerHTML = `<p style="color: #ff4444;">❌ Erro ao processar o vídeo: ${error.message}<br><br>💡 Dica: Tente usar um link diferente ou verifique sua conexão.</p>`;
      resultsDiv.style.display = 'block';
    } finally {
      loadingDiv.style.display = 'none';
    }
  }
</script>
</body>
</html>
